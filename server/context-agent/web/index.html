<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chorify · 上下文 Agent</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><h1>Chorify <small>上下文 Agent</small></h1><button id="new">新对话</button></header><p id="config"></p><section id="messages" aria-live="polite"></section><section id="assets"></section><section id="proposals"></section><p id="status" role="status"></p><form id="chat"><textarea id="message" placeholder="描述你想完成的事。已有内容可以继续修改。" required></textarea><details><summary>添加资料</summary><label>文字资料（TXT / JSON / Markdown）<input id="files" type="file" multiple accept=".txt,.json,.md"></label><label>图片公网 HTTPS 地址<input id="image" type="url" placeholder="https://..."></label></details><div class="actions"><button id="send" type="submit">发送</button><button id="cancel" type="button">停止</button></div></form></main><script type="module" src="/app.js"></script></body></html>
