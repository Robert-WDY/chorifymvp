<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chorify MVP</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><h1>Chorify <small>MVP</small></h1><button id="new">新对话</button></header><p id="config"></p><details id="history"><summary>历史对话</summary><label>查找对话<input id="history-query" type="search" placeholder="标题或最近内容"></label><button id="history-refresh" type="button">刷新 / 搜索</button><span id="history-count"></span> <a id="history-export" download>导出当前完整记录</a><nav id="history-list" aria-label="历史对话"></nav><button id="history-more" type="button" hidden>更多</button></details><section id="messages" aria-live="polite"></section><section id="questions" aria-live="polite"></section><section id="assets"></section><section id="proposals"></section><p id="status" role="status"></p><button id="retry" type="button" hidden>重试恢复原会话</button><form id="chat"><textarea id="message" placeholder="描述你想完成的事。Enter 发送，Shift+Enter 换行。" required></textarea><details><summary>添加资料</summary><label>文字资料（TXT / JSON / Markdown）<input id="files" type="file" multiple accept=".txt,.json,.md"></label><label>图片公网 HTTPS 地址<input id="image" type="url" placeholder="https://..."></label></details><div class="actions"><button id="send" type="submit">发送</button><button id="cancel" type="button">停止</button></div></form></main><script type="module" src="/app.js"></script></body></html>
