<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chorify · 流程诊断</title><link rel="stylesheet" href="/debug.css"></head>
<body><header><div><a href="/">← 返回创作页面</a><h1>流程诊断 <small>看问题，也看后续如何处理</small></h1></div><div class="controls"><label><input id="auto" type="checkbox" checked>跟随更新</label><button id="refresh">刷新</button><a id="export">导出原始证据</a></div></header>
<p id="status" role="status">正在读取会话…</p>
<main><aside><h2>选择会话</h2><form id="search-form"><input id="search" type="search" placeholder="按对话内容搜索" aria-label="搜索会话"><button>查找</button></form><nav id="sessions" aria-label="会话列表"></nav><button id="more" hidden>更多会话</button><h2>对话轮次</h2><nav id="turns" aria-label="轮次列表"></nav></aside>
<div class="workspace"><section id="conversation" aria-label="完整多轮对话"></section><section id="overview"></section><section id="stats" aria-label="当前轮次统计"></section><section id="problems" aria-label="问题与待核查信号"></section><section><h2>模块之间发生了什么</h2><div id="modules"></div><p class="muted">显示该轮各模块最近的记录。模型反馈可见，不等于语义问题已经解决。</p></section>
<div class="inspection"><section class="timeline"><div class="section-head"><h2>按发生顺序回看</h2><select id="filter" aria-label="流程筛选"><option value="all">全部过程</option><option value="problems">问题附近</option><option value="agent">Agent 决策</option><option value="context">上下文与记忆</option><option value="execution">工具与反馈</option></select></div><div id="timeline"></div></section><article id="detail"><h2>处理详情</h2><p>选择问题或流程步骤，查看输入、处理结果与后续动作。</p></article></div></div></main><script type="module" src="/debug.js"></script></body></html>
