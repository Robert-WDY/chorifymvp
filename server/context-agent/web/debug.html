<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chorify · Debug</title><link rel="stylesheet" href="/debug.css"></head>
<body><header><div><a href="/">← Chorify MVP</a><h1>Agent 中间过程 <small>Debug</small></h1></div><div class="controls"><label><input id="auto" type="checkbox" checked>自动刷新</label><button id="refresh">刷新</button><a id="export">导出完整 Trace</a></div></header>
<p id="status" role="status">正在读取会话…</p><section id="stats" aria-label="调用统计"></section>
<main><aside><h2>会话</h2><form id="search-form"><input id="search" type="search" placeholder="搜索历史会话" aria-label="搜索会话"><button>搜索</button></form><nav id="sessions" aria-label="会话列表"></nav><button id="more" hidden>更多会话</button><h2>对话轮次</h2><nav id="turns" aria-label="轮次列表"></nav></aside>
<section class="timeline"><h2>执行时间线</h2><p class="muted">用户输入 → 模型调用 → 系统处理 → 工具反馈。点击节点查看原始证据。</p><label>筛选 <select id="filter"><option value="all">全部节点</option><option value="model">模型调用</option><option value="tool">工具调用</option><option value="event">系统事件</option></select></label><div id="timeline"></div></section>
<article id="detail"><h2>调用详情</h2><p>选择时间线节点，查看分块输入、模型输出或工具回执。</p></article></main>
<script type="module" src="/debug.js"></script></body></html>
