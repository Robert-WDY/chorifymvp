<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创作助手</title><meta name="description" content="通过结构化规划、Skill 和工具完成创作。"><link rel="stylesheet" href="/style.css"></head>
<body><aside id="sidebar"><a class="brand" href="/">创作助手<span>MVP</span></a><button id="new" class="new">＋ 新建任务</button><section class="history-section" aria-label="历史对话"><div class="history-heading"><h2>历史对话</h2><button id="history-refresh" type="button" aria-label="刷新历史对话" title="刷新历史对话">↻</button></div><label class="sr-only" for="history-search">搜索历史对话</label><input id="history-search" type="search" placeholder="搜索历史对话" maxlength="200"><div id="history-list" role="navigation" aria-label="历史对话列表"><p class="history-empty">正在读取…</p></div><button id="history-more" type="button" hidden>加载更多</button></section><details class="toolbox"><summary>创作工具箱</summary><div id="skills" class="skills"></div></details><footer><div id="model">连接中…</div><div id="connection"></div></footer></aside>
<div id="history-overlay" hidden></div><main><header><button id="history-toggle" type="button" aria-label="打开历史对话" aria-expanded="false">☰ 历史</button><div>创作助手 <span class="tag">ReAct</span></div><span class="muted">理解 · 规划 · 执行 · 验证</span></header><div id="workspace"><div id="chat" aria-live="polite"><section id="welcome"><div class="eyebrow">从一个想法开始</div><h1>你想创作什么？</h1><p>描述你的目标，让助手选择合适的方法和工具。</p><div class="examples"><button data-prompt="帮我改写一条 15 秒咖啡广告视频提示词：清晨，女孩打开咖啡，整个城市慢慢苏醒。保留创意，增强画面连续性。">提示词改写<span>让想法变得具体、可执行 ↗</span></button><button data-prompt="生成一张竖版咖啡海报，晨光、胶片质感，主体是一杯冰拿铁，无文字。">图片创作<span>把画面交给生成工具 ↗</span></button><button data-prompt="生成一条 5 秒视频：晨光中的咖啡杯，镜头缓慢推进，蒸汽向上飘散，写实电影质感。">视频创作<span>从描述到生成任务 ↗</span></button></div></section></div>
<section id="task-panel" hidden></section></div><section class="composer"><form id="form"><label for="message" class="sr-only">描述需求</label><textarea id="message" rows="3" placeholder="描述需求，也可以继续修改上一份结果…" maxlength="30000" required></textarea><div class="composer-bottom"><span>Enter 发送 · Shift+Enter 换行</span><button id="stop" type="button" hidden>停止</button><button id="send" type="submit">开始创作 ↑</button></div></form><p id="hint">图片与视频调用将使用 方舟账户额度。</p></section></main><script src="/app.js" type="module"></script></body></html>
